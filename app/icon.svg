<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Subtle grid lines (map feel) -->
  <line x1="10" y1="2" x2="10" y2="30" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="22" y1="2" x2="22" y2="30" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="2" y1="10" x2="30" y2="10" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.12"/>
  <line x1="2" y1="22" x2="30" y2="22" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.12"/>

  <!-- Lightning bolt -->
  <path d="M18.5 4 L10 17.5 H16 L13.5 28 L23 14.5 H17 L18.5 4Z"
        fill="url(#bolt)"
        stroke="#fbbf24"
        stroke-width="0.4"
        stroke-linejoin="round"/>

  <!-- Glow beneath bolt -->
  <path d="M18.5 4 L10 17.5 H16 L13.5 28 L23 14.5 H17 L18.5 4Z"
        fill="#fde047"
        opacity="0.15"
        filter="blur(2px)"/>
</svg>
